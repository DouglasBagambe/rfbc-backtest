name: G DESK reliability
on:
  push:
    branches: [fix/gdesk-hourly-reliability, strategy2-round2-wip]
  pull_request:
    branches: [strategy2-round2-wip]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r monitor/requirements.txt pytest
      - run: python -m compileall -q monitor
      - run: python -m pytest monitor -q
